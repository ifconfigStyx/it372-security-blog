<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog - Vincent</title>
  <meta name="description" content="Vincent's blog about information security.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap nav">
    <a class="brand" href="/">Vincent's <span>Blog</span></a>
    <nav>
      <a href="/">Home</a>
      <a href="#posts">Posts</a>
    </nav>
  </div>
</header>

<main class="wrap">

  <section class="hero">
    <h1>My Blog</h1>
    <p class="lead">
      Just some stuff I wrote for class.
    </p>
  </section>

  <section id="posts">
    <div class="section-head">
      <h2>Posts</h2>
      <input
        id="search"
        type="search"
        placeholder="Search..."
        aria-label="Search posts"
      >
    </div>

    <div id="post-list" class="post-grid">
      <p class="muted">Loading posts...</p>
    </div>
  </section>

</main>

<footer class="wrap footer">
  &copy; 2026
</footer>

<script src="app.js"></script>

</body>
</html>
